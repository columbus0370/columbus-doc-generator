services:
  - type: web
    name: columbus-doc-generator-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && (apt-get install -y --no-install-recommends fonts-ipafont-gothic && fc-cache -f || true)
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
    healthCheckPath: /health
